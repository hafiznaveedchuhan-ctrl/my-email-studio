# Optional CI: review changed launch emails on every PR.
# Requires an ANTHROPIC_API_KEY repo secret. Safe to delete if you don't use CI.
name: email-review

on:
  pull_request:
    paths:
      - "campaigns/steep-club-launch/emails/**"
      - "campaigns/steep-club-launch/personalized/**"

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code
      - name: Review each email (fails on HIGH severity)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -e
          for f in campaigns/steep-club-launch/emails/*.md \
                   campaigns/steep-club-launch/personalized/*/*.md; do
            echo "::group::$f"
            node scripts/review.mjs "$f" --baseline review/baseline.json
            echo "::endgroup::"
          done
